<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>OPFS Media Cache · 轮播视频持久化缓存</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header><div class="brand" aria-label="OPFS Media Cache">◈ <span>OPFS MEDIA CACHE</span></div><span class="badge">v0.1 · 本地演示</span></header>
    <section class="intro"><p class="eyebrow">APPLICATION-MANAGED VIDEO STORAGE</p><h1>让轮播视频，<br>留在磁盘里。</h1><p class="lead">播放示例后刷新页面，查看 HLS 分片和 FLV 字节块的本地命中情况。</p></section>
    <section class="workspace">
      <div class="player"><video id="video" controls muted playsinline></video><div class="toolbar"><button id="hls">播放 HLS</button><button id="flv" class="secondary">播放 FLV</button><button id="stop" class="quiet">停止</button><span id="playback" role="status">准备中…</span></div></div>
      <aside><p class="eyebrow">STORAGE OVERVIEW</p><h2 id="backend">正在连接 OPFS</h2><div class="metrics"><div><span>缓存命中</span><strong id="hits">0</strong></div><div><span>已保存</span><strong id="bytes">0 KB</strong></div><div><span>媒体条目</span><strong id="entries">0</strong></div><div><span>自动淘汰</span><strong id="evictions">0</strong></div></div><label class="pin"><input id="pin" type="checkbox" checked>保护演示播放列表，避免被自动淘汰</label><button id="clear" class="secondary full">清空本演示的缓存</button><p class="note">示例播放完成后，刷新页面再播一次。数据保存完整后，可在页面中断网重播。</p><p id="quota" class="note"></p></aside>
    </section>
    <section class="events"><div><h2>缓存事件</h2><span>最近 60 条 · 当前页面</span></div><pre id="log" aria-live="polite"></pre></section>
    <footer>测试视频由 FFmpeg 合成 · 接入方法与 API 见项目 README</footer>
  </main>
  <script type="module" src="/main.ts"></script>
</body>
</html>
